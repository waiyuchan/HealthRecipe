[project]
name = "health-recipe"
version = "3.0.0"
description = "A lightweight, local-first household recipe planner"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.162,<1", "uvicorn>=0.30,<1", "beautifulsoup4>=4.12,<5", "requests>=2.32,<3"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
